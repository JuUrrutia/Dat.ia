server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # `/api/v1/connectors/upload` sube bases de datos enteras (SQLite, Excel,
    # CSV, dumps SQL). El default de 1m rechazaba los archivos con 413 antes de
    # que FastAPI los viera.
    client_max_body_size 512m;
    client_body_timeout 300s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # CSP básica, alineada con lo que index.html carga de verdad:
    #  - el tema se aplica con un <script> inline antes del primer paint, así que
    #    script-src necesita 'unsafe-inline' (o un sha256 del bloque, que se
    #    recalcula cada vez que se toca ese script);
    #  - la tipografía viene de Google Fonts (index.html:20-22), no del bundle.
    # `frame-ancestors` evita que la app se emplace en un iframe.
    #
    # `connect-src` NO puede ser solo 'self'. El SPA no habla siempre con este
    # mismo origen:
    #  - `api_client.ts:24` usa por defecto `http://127.0.0.1:8000/api/v1`, o sea
    #    un origen distinto al que sirve el bundle. Solo pasa a ser mismo origen
    #    si VITE_API_BASE_URL se construye como ruta relativa y el `location /api/`
    #    de mas abajo hace su trabajo.
    #  - `features/chat/services/llm_service.ts` hace fetch directo a los puertos
    #    del LLM local (8080, 11434, 1234) cuando el POST al backend falla.
    # Con 'self' a secas, ambas rutas quedan bloqueadas por el navegador y el
    # fallo se presenta como un error de red sin explicación.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Static assets with caching.
    # OJO: un add_header dentro de un `location` DESCARTA los del nivel `server`
    # (no se heredan, se reemplazan), así que aquí hay que repetir la CSP o los
    # .js/.css se sirven sin ella.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # API reverse proxy to backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un forecast sobre una base grande, o una consulta con LLM local
        # (8-25 s de inferencia) con auto-corrección, pasa de 60 s con
        # facilidad.
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        # `/api/v1/chat/query/stream` es SSE. Sin esto nginx acumula la
        # respuesta en su buffer y el frontend recibe el stream de golpe al
        # final, que es exactamente lo que el streaming evita.
        proxy_buffering off;
    }

    # SPA routing: fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sin `error_page 500 502 503 504 /50x.html` a propósito: ese archivo no lo
    # produce `npm run build` (solo hay index.html y assets/), así que la
    # directive convertía cada 500 del backend en un 404 en vez de una página de
    # error. Sin ella nginx sirve su página de error por defecto.
}